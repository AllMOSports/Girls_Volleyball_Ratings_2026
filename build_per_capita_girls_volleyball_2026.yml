# .github/workflows/build_per_capita_girls_volleyball_2026.yml
#
# Girls Volleyball size-adjusted ("per capita") rankings.
# Runs build_per_capita_2026.py --sport girls_volleyball and commits
# per_capita_girls_volleyball_2026.json / .csv back to this repo.
#
# Triggers:
#   - workflow_run: right after "Girls Volleyball 2026 (games, schedule, ratings)" finishes successfully.
#     That workflow commits girls_volleyball_ratings_2026.json with the default
#     GITHUB_TOKEN, and bot commits don't fire push triggers, so chaining
#     is how this picks up each night's new ratings.
#   - push: when the script or the enrollment file changes from a manual commit
#   - repository_dispatch: lets cron-job.org fire it via the GitHub API
#     (event_type: build-per-capita-girls-volleyball)
#   - workflow_dispatch: manual run from the Actions tab
#
# Reads only files already in this repo, never MSHSAA, so GitHub runner IP
# blocking doesn't affect it.

name: Build Per Capita Girls Volleyball (2026)

on:
  workflow_run:
    workflows: ["Girls Volleyball 2026 (games, schedule, ratings)"]
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "build_per_capita_2026.py"
      - "mshsaa_enrollments_2026-2027.json"
  repository_dispatch:
    types: [build-per-capita-girls-volleyball]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-per-capita-girls-volleyball-2026
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip if the upstream ratings run failed or was skipped by its gate.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy

      - name: Build size-adjusted rankings
        run: python build_per_capita_2026.py --sport girls_volleyball

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add per_capita_girls_volleyball_2026.json per_capita_girls_volleyball_2026.csv
          if git diff --cached --quiet; then
            echo "No changes to per capita outputs."
            exit 0
          fi
          git commit -m "Update per capita girls volleyball ratings ($(TZ=America/Chicago date +'%Y-%m-%d %H:%M CT'))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
          exit 1
